name: Deploy Mobile (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Select Platform to Build & Deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      version_name:
        description: 'Version Name (e.g. 1.0.0 - leave blank to use package.json)'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Build Number / Version Code (leave blank for GitHub Run Number)'
        required: false
        default: ''
        type: string
      android_track:
        description: 'Google Play Track (if deploying Android)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload_to_stores:
        description: 'Upload builds directly to Google Play / App Store TestFlight'
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # Android Build & Deploy Job
  # ==========================================
  deploy-android:
    name: Android Build & Deploy
    if: ${{ github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Calculate Version Info
        id: versioning
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          VERSION_NAME="${INPUT_VERSION:-$PKG_VERSION}"

          INPUT_CODE="${{ github.event.inputs.build_number }}"
          VERSION_CODE="${INPUT_CODE:-$GITHUB_RUN_NUMBER}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform folder not found. Adding Android platform with Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Android Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/release.keystore
          echo "KEYSTORE_PATH=keystores/release.keystore" >> $GITHUB_ENV

      - name: Decode Google Services JSON
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Apply Versioning to Android Gradle
        env:
          V_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          V_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
        run: |
          sed -i "s/versionCode 1/versionCode $V_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0.0\"/versionName \"$V_NAME\"/g" android/app/build.gradle

      - name: Build Android App Bundle (AAB) & APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew bundleRelease assembleRelease \
              -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
              -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew bundleRelease assembleRelease
          fi

      - name: Upload Android AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-android-v${{ steps.versioning.outputs.VERSION_NAME }}-b${{ steps.versioning.outputs.VERSION_CODE }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Android APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-android-v${{ steps.versioning.outputs.VERSION_NAME }}-b${{ steps.versioning.outputs.VERSION_CODE }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB to Google Play
        if: ${{ github.event.inputs.upload_to_stores == 'true' && env.HAVE_SERVICE_ACCOUNT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        env:
          HAVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.shuffle.security
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.android_track }}
          status: 'completed'
          inAppUpdatePriority: 2

  # ==========================================
  # iOS Build & Deploy Job
  # ==========================================
  deploy-ios:
    name: iOS Build & Deploy
    if: ${{ github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'ios' }}
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 15/16
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Calculate Version Info
        id: versioning
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          VERSION_NAME="${INPUT_VERSION:-$PKG_VERSION}"

          INPUT_CODE="${{ github.event.inputs.build_number }}"
          BUILD_NUMBER="${INPUT_CODE:-$GITHUB_RUN_NUMBER}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            echo "iOS platform folder not found. Adding iOS platform with Capacitor..."
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install Apple Certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD || 'shuffle-build-keychain-pass' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Install Provisioning Profile & Extract Metadata
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/temp_profile.mobileprovision
          
          # Extract UUID and Name from mobileprovision
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/temp_profile.mobileprovision"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/temp_profile.mobileprovision"))
          
          cp "$RUNNER_TEMP/temp_profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Update iOS Project Version Numbers
        working-directory: ios/App
        env:
          V_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          B_NUM: ${{ steps.versioning.outputs.BUILD_NUMBER }}
        run: |
          xcrun agvtool new-marketing-version "$V_NAME" || true
          xcrun agvtool new-version -all "$B_NUM" || true

      - name: Generate ExportOptions.plist
        run: |
          if [ -n "$PROFILE_NAME" ]; then
            cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>io.shuffle.security</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          else
            cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          fi

      # Build Xcode Archive
      - name: Build Xcode Archive
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            echo "Building with workspace..."
            BUILD_FLAG="-workspace App.xcworkspace"
          else
            echo "Building with project (SPM)..."
            BUILD_FLAG="-project App.xcodeproj"
          fi

          if [ -n "$PROFILE_UUID" ]; then
            echo "Archiving with Manual code signing using profile $PROFILE_NAME ($PROFILE_UUID)..."
            xcodebuild archive \
              $BUILD_FLAG \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath $RUNNER_TEMP/App.xcarchive \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"
          else
            echo "Archiving with Automatic code signing..."
            xcodebuild archive \
              $BUILD_FLAG \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath $RUNNER_TEMP/App.xcarchive \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              CODE_SIGN_STYLE=Automatic
          fi

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build-output

      - name: Upload iOS IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-ios-v${{ steps.versioning.outputs.VERSION_NAME }}-b${{ steps.versioning.outputs.BUILD_NUMBER }}-ipa
          path: ${{ runner.temp }}/build-output/*.ipa
          retention-days: 30

      - name: Upload to App Store Connect / TestFlight
        if: ${{ github.event.inputs.upload_to_stores == 'true' && env.HAVE_ASC_KEY == 'true' }}
        env:
          HAVE_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 != '' }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/build-output -name "*.ipa" | head -n 1)
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean Up Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/.appstoreconnect/private_keys || true
          rm -f $RUNNER_TEMP/certificate.p12 || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision || true
