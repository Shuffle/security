name: Publish Shuffle packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # so called workflows can request id-token: write for npm provenance

concurrency:
  group: publish-shuffle-packages
  cancel-in-progress: false

jobs:
  resolve-core-version:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(npm view '@shuffleio/shuffle-core' version 2>/dev/null || echo "0.0.0")

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to parse previous version for @shuffleio/shuffle-core: $CURRENT_VERSION"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))"

          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Previous version for @shuffleio/shuffle-core: $CURRENT_VERSION"
          echo "Next version for @shuffleio/shuffle-core: $NEXT_VERSION"

  resolve-mcps-version:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(npm view '@shuffleio/shuffle-mcps' version 2>/dev/null || echo "0.0.0")

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to parse previous version for @shuffleio/shuffle-mcps: $CURRENT_VERSION"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))"

          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Previous version for @shuffleio/shuffle-mcps: $CURRENT_VERSION"
          echo "Next version for @shuffleio/shuffle-mcps: $NEXT_VERSION"

  publish-core:
    needs: resolve-core-version
    uses: ./.github/workflows/publish-shuffle-core.yaml
    with:
      version: ${{ needs.resolve-core-version.outputs.next_version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  publish-mcps:
    needs: resolve-mcps-version
    uses: ./.github/workflows/publish-shuffle-mcps.yml
    with:
      version: ${{ needs.resolve-mcps-version.outputs.next_version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
