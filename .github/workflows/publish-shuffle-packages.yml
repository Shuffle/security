name: Publish Shuffle packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-shuffle-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_scope: '@shuffleio/shuffle-core'
            working_directory: src/Shuffle-Core
            artifact_prefix: shuffle-core
          - package_scope: '@shuffleio/shuffle-mcps'
            working_directory: src/Shuffle-MCPs
            artifact_prefix: shuffle-mcps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(npm view ${{ matrix.package_scope }} version 2>/dev/null || echo "0.0.0")

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to parse previous version for ${{ matrix.package_scope }}: $CURRENT_VERSION"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEXT_VERSION="$major.$minor.$((patch + 1))"

          echo "previous_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Previous version for ${{ matrix.package_scope }}: $CURRENT_VERSION"
          echo "Next version for ${{ matrix.package_scope }}: $NEXT_VERSION"

      - name: Materialize package.json
        working-directory: ${{ matrix.working_directory }}
        run: |
          node -e "
            const fs = require('fs');
            const tpl = JSON.parse(fs.readFileSync('package.tpl.json', 'utf8'));
            tpl.version = '${{ steps.version.outputs.next_version }}';
            fs.writeFileSync('package.json', JSON.stringify(tpl, null, 2) + '\\n');
          "
          cat package.json

      - name: Install library deps
        working-directory: ${{ matrix.working_directory }}
        run: npm install --no-package-lock

      - name: Build library
        working-directory: ${{ matrix.working_directory }}
        run: npm run build

      - name: Pack
        working-directory: ${{ matrix.working_directory }}
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_prefix }}-${{ steps.version.outputs.next_version }}.tgz
          path: ${{ matrix.working_directory }}/*.tgz

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ matrix.working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if npm publish --access public --provenance; then
            exit 0
          fi

          if [ -z "${NPM_TOKEN:-}" ]; then
            exit 1
          fi

          echo "Token-based publish failed. Retrying with GitHub OIDC trusted publishing."
          unset NODE_AUTH_TOKEN NPM_TOKEN
          rm -f "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" "$HOME/.npmrc"
          npm publish --access public --provenance

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: packed ${{ matrix.package_scope }}@${{ steps.version.outputs.next_version }}"
          else
            echo "Published ${{ matrix.package_scope }}@${{ steps.version.outputs.next_version }}"
          fi
