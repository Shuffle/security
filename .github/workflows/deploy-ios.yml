name: Deploy iOS to Apple App Store / TestFlight

on:
  workflow_dispatch:
    inputs:
      info:
        description: 'Notice: Automated iOS cloud deployment is disabled. Builds should be made locally via Xcode.'
        required: false
        default: 'Read instructions in workflow log'
        type: string

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-build-notice:
    name: iOS Build Instructions (Manual Xcode Required)
    runs-on: ubuntu-latest

    steps:
      - name: Display Manual Xcode Build & Distribution Guide
        run: |
          cat << 'GUIDE' | tee -a $GITHUB_STEP_SUMMARY
          # iOS Deployment Instructions (Local Xcode Required)

          Automated iOS CI/CD signing and cloud archiving are intentionally disabled in favor of local Xcode manual distribution. This avoids cloud runner keychain, certificate, and profile synchronization issues.

          ---

          ## Step-by-Step Guide to Build & Upload to TestFlight / App Store

          ### 1. Pull Latest Code on your Mac
          ```bash
          git pull origin main
          ```

          ### 2. Install Dependencies & Build Web Bundle
          ```bash
          npm install
          npm run build
          ```

          ### 3. Sync Capacitor iOS & Apply Patches
          ```bash
          npx cap sync ios
          node scripts/patch-capacitor-plugins.js
          ```

          ### 4. Open in Xcode
          ```bash
          npx cap open ios
          ```

          ### 5. Configure Signing & Archive in Xcode
          1. In Xcode's **Signing & Capabilities** tab for target **App**:
             - Ensure **Automatically manage signing** is checked.
             - Select your **Team** (Team ID `ZU5C69PJS4`).
             - Ensure **Bundle Identifier** is `com.shuffle.security`.
          2. In the top destination dropdown:
             - Select your registered Mac (e.g., `Freds mac` / `My Mac`) or `Any iOS Device (arm64)`.
          3. Go to **Product** -> **Archive** in the menu bar.

          ### 6. Distribute to TestFlight
          1. Once the **Organizer** window opens with your finished archive, select it and click **Distribute App** (right pane).
          2. Select **App Store Connect** -> **Upload**.
          3. Keep default settings (Upload Symbols, Manage Version) and select **Automatically manage signing**.
          4. Click **Upload**.

          Your build will be processed by Apple and appear in **TestFlight** within 5–10 minutes.
          GUIDE

          echo "::error title=Automated iOS Cloud Deployment Disabled::iOS builds must be archived and uploaded manually from Xcode on macOS. See the run summary or logs above for the step-by-step guide."
          exit 1
