name: Deploy iOS to Apple App Store / TestFlight

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Marketing Version (e.g. 1.0.0 - leave blank to use package.json version)'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Build Number (Integer - leave blank to use GitHub Run Number)'
        required: false
        default: ''
        type: string
      export_method:
        description: 'Export Method'
        required: true
        default: 'app-store'
        type: choice
        options:
          - app-store
          - ad-hoc
          - development
          - enterprise
      upload_to_app_store:
        description: 'Upload to App Store Connect / TestFlight automatically'
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy-ios:
    name: Build & Upload iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js Environment
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Select Active Xcode Version
      - name: Select Xcode 16/15
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      # 4. Install Dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      # 5. Determine Marketing Version and Build Number
      - name: Calculate Version Info
        id: versioning
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          VERSION_NAME="${INPUT_VERSION:-$PKG_VERSION}"

          INPUT_CODE="${{ github.event.inputs.build_number }}"
          BUILD_NUMBER="${INPUT_CODE:-$GITHUB_RUN_NUMBER}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Resolved Marketing Version: $VERSION_NAME"
          echo "Resolved Build Number: $BUILD_NUMBER"

      # 6. Build Web Application & Sync Capacitor iOS
      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            echo "iOS platform folder not found. Adding iOS platform with Capacitor..."
            npx cap add ios
          fi
          node scripts/patch-capacitor-plugins.js
          npx cap sync ios
          node scripts/patch-capacitor-plugins.js

      # 7. Configure Temporary Keychain & Install Apple Certificate
      - name: Install Apple Certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD || 'shuffle-build-keychain-pass' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      # 8. Install Provisioning Profile & Extract Metadata
      - name: Install Provisioning Profile
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/temp_profile.mobileprovision
          
          # Extract UUID, Name, and Bundle ID from mobileprovision
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/temp_profile.mobileprovision"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/temp_profile.mobileprovision"))
          RAW_APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/temp_profile.mobileprovision"))
          BUNDLE_ID="${RAW_APP_ID#*.}"

          cp "$RUNNER_TEMP/temp_profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Resolved Bundle ID from profile: $BUNDLE_ID"

      # 9. Update Version and Build Numbers in iOS Project
      - name: Update iOS Project Version Numbers
        working-directory: ios/App
        env:
          V_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          B_NUM: ${{ steps.versioning.outputs.BUILD_NUMBER }}
        run: |
          xcrun agvtool new-marketing-version "$V_NAME" || true
          xcrun agvtool new-version -all "$B_NUM" || true
          echo "Updated iOS marketing version to $V_NAME and build number to $B_NUM"

      # 10. Create ExportOptions.plist
      - name: Generate ExportOptions.plist
        run: |
          TARGET_BUNDLE_ID="${BUNDLE_ID:-com.shuffle.security}"
          if [ -n "$PROFILE_NAME" ]; then
            cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ github.event.inputs.export_method }}</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${TARGET_BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          else
            cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ github.event.inputs.export_method }}</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          fi

      # 11. Resolve Swift Package Dependencies
      - name: Resolve Swift Package Dependencies
        working-directory: ios/App
        run: |
          echo "Resolving Xcode Swift Package Manager dependencies..."
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -resolvePackageDependencies -workspace App.xcworkspace -scheme App
          else
            xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
          fi

      # 12. Compile & Validate Swift Plugins & App (Dry Run Compilation Check)
      - name: Compile & Validate App (Dry Run)
        working-directory: ios/App
        run: |
          echo "========================================================"
          echo "Compiling iOS App & Plugins to verify Swift compatibility..."
          echo "========================================================"
          if [ -d "App.xcworkspace" ]; then
            BUILD_FLAG="-workspace App.xcworkspace"
          else
            BUILD_FLAG="-project App.xcodeproj"
          fi

          set -o pipefail
          xcodebuild clean build \
            $BUILD_FLAG \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcode_compile.log" || {
              EXIT_CODE=$?
              echo "::error::Xcode Compilation Failed! Displaying detailed compiler errors below:"
              echo "==================== COMPILER ERRORS ===================="
              grep -C 3 -E "(error:|fatal error:|BUILD FAILED)" "$RUNNER_TEMP/xcode_compile.log" || tail -n 100 "$RUNNER_TEMP/xcode_compile.log"
              echo "========================================================="
              exit $EXIT_CODE
            }
          echo "App and all Swift plugins compiled successfully!"

      # 13. Build & Archive Xcode Application (Packaging & Code Signing)
      - name: Build Xcode Archive
        working-directory: ios/App
        run: |
          TARGET_BUNDLE_ID="${BUNDLE_ID:-com.shuffle.security}"
          if [ -d "App.xcworkspace" ]; then
            BUILD_FLAG="-workspace App.xcworkspace"
          else
            BUILD_FLAG="-project App.xcodeproj"
          fi

          set -o pipefail
          if [ -n "$PROFILE_UUID" ]; then
            echo "Archiving with Manual code signing using profile $PROFILE_NAME ($PROFILE_UUID) for $TARGET_BUNDLE_ID..."
            xcodebuild archive \
              $BUILD_FLAG \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              PRODUCT_BUNDLE_IDENTIFIER="$TARGET_BUNDLE_ID" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              2>&1 | tee "$RUNNER_TEMP/xcode_archive.log" || {
                EXIT_CODE=$?
                echo "::error::Xcode Archive Failed! Displaying archive error summary below:"
                echo "===================== ARCHIVE ERRORS ====================="
                grep -E "(: error:|fatal error:|BUILD FAILED|Code Signing Error)" "$RUNNER_TEMP/xcode_archive.log" || true
                echo "=========================================================="
                exit $EXIT_CODE
              }
          else
            echo "Archiving with Automatic code signing..."
            xcodebuild archive \
              $BUILD_FLAG \
              -scheme App \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              CODE_SIGN_STYLE=Automatic \
              2>&1 | tee "$RUNNER_TEMP/xcode_archive.log" || {
                EXIT_CODE=$?
                echo "::error::Xcode Archive Failed! Displaying archive error summary below:"
                echo "===================== ARCHIVE ERRORS ====================="
                grep -E "(: error:|fatal error:|BUILD FAILED|Code Signing Error)" "$RUNNER_TEMP/xcode_archive.log" || true
                echo "=========================================================="
                exit $EXIT_CODE
              }
          fi

      # 14. Export Archive to IPA
      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/build-output" \
            2>&1 | tee "$RUNNER_TEMP/xcode_export.log" || {
              EXIT_CODE=$?
              echo "::error::IPA Export Failed! Displaying export error summary below:"
              echo "===================== EXPORT ERRORS ====================="
              grep -E "(: error:|fatal error:|EXPORT FAILED)" "$RUNNER_TEMP/xcode_export.log" || true
              echo "========================================================="
              exit $EXIT_CODE
            }

      # 15. Upload Xcode Diagnostic Logs (Always captured)
      - name: Upload Xcode Build & Archive Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostic-logs-run-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/xcode_*.log
            ${{ runner.temp }}/build-output/*.log
          if-no-files-found: ignore
          retention-days: 14

      # 16. Upload IPA to GitHub Artifacts
      - name: Upload iOS IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-security-ios-v${{ steps.versioning.outputs.VERSION_NAME }}-b${{ steps.versioning.outputs.BUILD_NUMBER }}-ipa
          path: ${{ runner.temp }}/build-output/*.ipa
          retention-days: 30

      # 17. Upload to App Store Connect / TestFlight
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_app_store == 'true' && env.HAVE_ASC_KEY == 'true' }}
        env:
          HAVE_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 != '' }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/build-output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "Error: No IPA file found to upload."
            exit 1
          fi

          echo "Preparing App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          echo "Uploading $IPA_FILE to App Store Connect / TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

          echo "Successfully uploaded IPA to App Store Connect!"

      # 18. Cleanup Keychain & Secrets
      - name: Clean Up Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/.appstoreconnect/private_keys || true
          rm -f $RUNNER_TEMP/certificate.p12 || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision || true
