name: Deploy Android to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      version_name:
        description: 'Version Name (e.g. 1.0.0 - leave blank to use package.json version)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Version Code (Integer - leave blank to use GitHub Run Number)'
        required: false
        default: ''
        type: string
      release_status:
        description: 'Release Status'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      upload_to_play_store:
        description: 'Upload to Google Play Console automatically'
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy-android:
    name: Build & Upload Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js Environment
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Setup Java JDK (Temurin 17 for modern Android Gradle Plugin)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Install Node Dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Determine Version Name and Version Code
      - name: Calculate Version Info
        id: versioning
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          INPUT_VERSION="${{ github.event.inputs.version_name }}"
          VERSION_NAME="${INPUT_VERSION:-$PKG_VERSION}"

          INPUT_CODE="${{ github.event.inputs.version_code }}"
          VERSION_CODE="${INPUT_CODE:-$GITHUB_RUN_NUMBER}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Resolved Version Name: $VERSION_NAME"
          echo "Resolved Version Code: $VERSION_CODE"

      # 6. Build Web Bundle & Sync to Android
      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      # 7. Configure Android Keystore for Signing
      - name: Decode Android Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystores/release.keystore
          echo "KEYSTORE_PATH=keystores/release.keystore" >> $GITHUB_ENV

      # 8. Decode Google Services JSON (FCM Push Notifications) if provided
      - name: Decode Google Services JSON
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          echo "google-services.json decoded successfully"

      # 9. Inject Version Code & Version Name into Android build.gradle
      - name: Apply Versioning to Android Gradle
        env:
          V_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          V_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
        run: |
          sed -i "s/versionCode 1/versionCode $V_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0.0\"/versionName \"$V_NAME\"/g" android/app/build.gradle
          echo "Updated android/app/build.gradle with versionCode=$V_CODE and versionName=$V_NAME"

      # 10. Build Signed Android App Bundle (AAB) & APK
      - name: Build Android App Bundle (AAB)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Building signed release bundle..."
            ./gradlew bundleRelease assembleRelease \
              -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
              -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "No keystore provided; building unsigned release bundle..."
            ./gradlew bundleRelease assembleRelease
          fi

      # 11. Archive Build Artifacts in GitHub Actions
      - name: Upload Android AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-security-android-v${{ steps.versioning.outputs.VERSION_NAME }}-b${{ steps.versioning.outputs.VERSION_CODE }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Android APK to GitHub Artifacts (For Direct Sideload Testing)
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-security-android-v${{ steps.versioning.outputs.VERSION_NAME }}-b${{ steps.versioning.outputs.VERSION_CODE }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 12. Upload to Google Play Console
      - name: Upload AAB to Google Play
        if: ${{ github.event.inputs.upload_to_play_store == 'true' && env.HAVE_SERVICE_ACCOUNT == 'true' }}
        uses: r0adkll/upload-google-play@v1
        env:
          HAVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.shuffle.security
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.release_status }}
          inAppUpdatePriority: 2
