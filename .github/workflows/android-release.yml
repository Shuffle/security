name: Build Android Release (AAB & APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android App Bundle (.aab) & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/patch-capacitor-plugins.js
          npx cap sync android
          node scripts/patch-capacitor-plugins.js

      - name: Decode Release Keystore (if secret provided)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/keystore/release.keystore" >> $GITHUB_ENV

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (.aab)
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew bundleDebug assembleDebug
          else
            ./gradlew bundleRelease assembleRelease
          fi

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-security-aab
          path: android/app/build/outputs/bundle/**/*.aab

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuffle-security-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release and Attach AAB/APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/**/*.aab
            android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
